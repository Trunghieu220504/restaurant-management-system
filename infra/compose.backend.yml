name: restaurant-staging
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set SQL password}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 2560m
    volumes:
      - sqldata:/var/opt/mssql
    networks: [internal]
    # No ports: SQL is accessible only by other containers.
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Restaurant: "Server=sqlserver,1433;Database=${MSSQL_DB:-RestaurantManagement};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set SQL password};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: ${JWT_ISSUER:-restaurant-api}
      Jwt__Audience: ${JWT_AUDIENCE:-restaurant-web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT signing key}
    depends_on: [sqlserver]
    expose: ["8080"]
    networks: [internal]
    # Forwarded headers/trusted proxies must be configured with backend owner.
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [internal]
volumes:
  sqldata:
networks:
  internal:
    driver: bridge
