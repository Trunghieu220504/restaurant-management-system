name: restaurant-staging
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set SQL password}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 2560m
    volumes:
      - sqldata:/var/opt/mssql
    networks: [internal]
    # No ports: SQL is accessible only by other containers.
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: "8080"
      ReverseProxy__KnownProxies__0: ${NGINX_INTERNAL_IP:-172.30.77.10}
      ConnectionStrings__Restaurant: "Server=sqlserver,1433;Database=${MSSQL_DB:-RestaurantManagement};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set SQL password};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: ${JWT_ISSUER:-restaurant-api}
      Jwt__Audience: ${JWT_AUDIENCE:-restaurant-web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT signing key}
    depends_on: [sqlserver]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [internal]
    # API has no host port; only the fixed Nginx address is a trusted proxy.
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      internal:
        ipv4_address: ${NGINX_INTERNAL_IP:-172.30.77.10}
volumes:
  sqldata:
networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.30.77.0/24}
