# Production is a separate project/database/network/secret set. Render config before use.
name: restaurant-production
services:
  sqlserver:
    image: ${PRODUCTION_SQL_IMAGE:?Set reviewed SQL image digest and licensed edition}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${PRODUCTION_SQL_EDITION:?Set licensed production edition}
      MSSQL_SA_PASSWORD: ${PRODUCTION_SQL_PASSWORD:?Use a production-only secret}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    restart: unless-stopped
    volumes: [production-sql:/var/opt/mssql]
    networks: [private]
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
  api:
    image: ${PRODUCTION_API_IMAGE:?Set reviewed immutable API digest}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Restaurant: "Server=sqlserver;Database=RestaurantProduction;User Id=sa;Password=${PRODUCTION_SQL_PASSWORD:?};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${PRODUCTION_JWT_SIGNING_KEY:?Use production-only signing key}
      Jwt__Issuer: restaurant-production
      Jwt__Audience: restaurant-production-web
      ReverseProxy__KnownProxies__0: "172.30.78.10"
    restart: unless-stopped
    networks: [private]
    logging: *logs
  web:
    image: ${PRODUCTION_WEB_IMAGE:?Set reviewed immutable web digest}
    environment:
      API_URL: http://api:8080
    restart: unless-stopped
    networks: [private]
    logging: *logs
  nginx:
    image: ${PRODUCTION_NGINX_IMAGE:?Set reviewed Nginx image digest}
    ports: ["${PRODUCTION_BIND_ADDRESS:-127.0.0.1}:8443:443"]
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PRODUCTION_CERT_DIRECTORY:?Set production certificate directory}:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      private:
        ipv4_address: 172.30.78.10
    logging: *logs
volumes:
  production-sql:
networks:
  private:
    ipam:
      config: [{subnet: 172.30.78.0/24}]
