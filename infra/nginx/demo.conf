map $http_upgrade $demo_connection_upgrade { default upgrade; '' close; }
log_format demo_safe '$remote_addr $request_method $uri $status';
server {
    listen 80;
    server_name localhost;
    server_tokens off;
    access_log /var/log/nginx/access.log demo_safe;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ { proxy_pass http://api:8080; }
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $demo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
}
