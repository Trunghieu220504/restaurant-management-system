name: Web CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**", "docs/**", "hotfix/**"]
    paths:
      - "web/**"
      - "docs/api/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "web/**"
      - "docs/api/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-api-client-sync:
    name: Verify API Client Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Regenerate API types from committed OpenAPI specification
        working-directory: web
        run: npm run gen:api

      - name: Verify generated API client has no unstaged changes
        run: |
          if ! git diff --exit-code web/src/lib/api/generated/; then
            echo "::error file=web/src/lib/api/generated/schema.d.ts::OpenAPI specification changed but generated API client types were not updated! Run 'npm run gen:api' in web/ and commit the changes."
            exit 1
          fi

  build-and-test:
    name: Web Build and Test
    needs: verify-api-client-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Format check
        working-directory: web
        run: npm run format:check

      - name: Unit and Integration Tests
        working-directory: web
        run: npm test

      - name: Build Next.js application
        working-directory: web
        run: npm run build
