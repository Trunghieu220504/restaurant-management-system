name: Backend CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**", "docs/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore RestaurantManagement.slnx --locked-mode
      - name: Check formatting
        run: dotnet format whitespace RestaurantManagement.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build RestaurantManagement.slnx -c Release --no-restore
      - name: Test
        run: dotnet test RestaurantManagement.slnx -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Export idempotent Audit migration from this exact source
        shell: bash
        env:
          ConnectionStrings__Restaurant: Server=127.0.0.1,1;Database=OfflineScriptOnly;Integrated Security=True;Encrypt=True;Connect Timeout=1
        run: |
          set -euo pipefail
          dotnet tool restore
          mkdir -p artifacts/migrations
          dotnet ef migrations script --idempotent --context AuditDbContext \
            --project src/Modules/Audit/Restaurant.Modules.Audit.Infrastructure \
            --startup-project src/Modules/Audit/Restaurant.Modules.Audit.Infrastructure \
            --configuration Release --no-build --output artifacts/migrations/audit.sql
          (cd artifacts/migrations && sha256sum audit.sql > SHA256SUMS)
      - name: Upload Audit migration for reviewed deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audit-sql-idempotent
          path: artifacts/migrations/
          if-no-files-found: error
          retention-days: 7
      - name: Publish API
        run: dotnet publish src/Host/Restaurant.Api/Restaurant.Api.csproj -c Release --no-build --no-restore -o artifacts/api
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7
      - name: Upload API artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: restaurant-api
          path: artifacts/api/
          retention-days: 7

  identity-sql-tests:
    name: Identity SQL Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Start disposable SQL Server
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$password"
          export MSSQL_SA_PASSWORD="$password"
          docker run -d --name identity-test-sql -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD mcr.microsoft.com/mssql/server:2022-latest
          echo "IDENTITY_TEST_SQLSERVER=Server=127.0.0.1,1433;User Id=sa;Password=$password;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5" >> "$GITHUB_ENV"
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec -e SQLCMDPASSWORD="$password" identity-test-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - name: Restore locked dependencies
        run: dotnet restore RestaurantManagement.slnx --locked-mode
      - name: Run SQL migration and bootstrap tests
        run: dotnet test tests/Restaurant.IntegrationTests -c Release --no-restore --filter FullyQualifiedName~SqlServer --logger trx --results-directory TestResults
      - name: Upload SQL test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: identity-sql-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f identity-test-sql || true

  publish-images:
    name: Publish images to GHCR
    needs: [build-and-test, identity-sql-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare image names
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "API_IMAGE=ghcr.io/${owner}/restaurant-api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${owner}/restaurant-web" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push API image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f infra/docker/Dockerfile.api \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${API_IMAGE}:${GITHUB_SHA}" -t "${API_IMAGE}:develop" .
          docker push "${API_IMAGE}:${GITHUB_SHA}"
          docker push "${API_IMAGE}:develop"
      - name: Build and push web image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f web/Dockerfile \
            --build-arg API_URL=http://api:8080 \
            --build-arg NEXT_PUBLIC_IDENTITY_REFRESH_ENABLED=true \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${WEB_IMAGE}:${GITHUB_SHA}" -t "${WEB_IMAGE}:develop" web
          docker push "${WEB_IMAGE}:${GITHUB_SHA}"
          docker push "${WEB_IMAGE}:develop"
      - name: Print published tags
        shell: bash
        run: |
          echo "GHCR_API_IMAGE=${API_IMAGE}:${GITHUB_SHA}"
          echo "GHCR_WEB_IMAGE=${WEB_IMAGE}:${GITHUB_SHA}"
