name: Frontend CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**", "ci/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, test and build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate API types from shared OpenAPI
        run: npx --no-install openapi-typescript ../docs/api/openapi.json -o src/lib/api/schema.d.ts

      - name: Check ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build Next.js
        run: npm run build
